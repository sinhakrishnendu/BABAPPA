[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babappa"
version = "0.8.0"
description = "Simulation-trained branch-site selection support from user-supplied codon MSAs and trees"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Krishnendu Sinha"}
]
keywords = ["molecular-evolution", "positive-selection", "branch-site", "codon", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build>=1",
    "twine>=5",
]
neural = [
    "torch",
]

[project.urls]
Homepage = "https://github.com/sinhakrishnendu/BABAPPA"
Repository = "https://github.com/sinhakrishnendu/BABAPPA"
Issues = "https://github.com/sinhakrishnendu/BABAPPA/issues"

[project.scripts]
babappa = "babappa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
babappa = [
    "model_packages/deployable_model_conservative_branch_site_100k_mps/*.json",
    "model_packages/deployable_model_conservative_branch_site_100k_mps/*.md",
    "model_packages/deployable_model_conservative_branch_site_100k_mps/*.sha256",
    "model_packages/deployable_model_conservative_branch_site_100k_mps/tier_models/*/*",
    "model_packages/deployable_model_conservative_branch_site_100k_mps/tier_calibrations/*/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
