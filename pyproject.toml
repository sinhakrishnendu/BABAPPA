[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babappa"
version = "0.5.1-alpha"
description = "Simulation-trained, alignment-ensemble and saturation-aware framework for robust branch-site selection inference"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Krishnendu Sinha"}
]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
neural = [
    "torch",
]

[project.scripts]
babappa = "babappa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
